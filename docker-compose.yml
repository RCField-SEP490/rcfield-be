services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rcfeild_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rcfeild_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rcfeild_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rcfeild_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlu-service:
    build:
      context: ./nlu-service
      dockerfile: Dockerfile
    container_name: rcfeild_nlu
    restart: unless-stopped
    environment:
      INTENTS_FILE: /app/intents/rcfield.json
    volumes:
      - ./nlu-service/intents:/app/intents:ro
    # Internal network only — not exposed on host ports
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
